<DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muda de cor</title>
</head>
<body>
    <h1>Personalizar a página!</h1>
    <p>Clique para mudar o fundo.</p>
    <button onclick="mudarCor()">
        Mudar de cor
    </button>
    <script>
      function mudarCor() {  
        
      document.body.style.backgroundColor="#c8f7c5";
    }

    </script>
</body>
</html>
